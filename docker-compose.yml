version: "3.8"

# edge-gateway-hub – Docker Compose stack
#
# Architecture:
#   wireguard  – WireGuard VPN hub; also owns the exposed host ports so that
#                nginx (which shares its network namespace) can bind to them.
#   nginx      – Layer-4 stream proxy; shares the WireGuard network namespace.
#   coredns    – Authoritative resolver for Internal Node WireGuard hostnames.

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/wireguard:/config
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "80:80"
      - "443:443"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    # Share wireguard's network namespace → nginx can reach wg0 peer IPs
    network_mode: "service:wireguard"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx:/etc/nginx/stream.d:ro
    depends_on:
      - wireguard
    restart: unless-stopped

  coredns:
    image: coredns/coredns:1.12.1
    container_name: coredns
    network_mode: "service:wireguard"
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
      - ./data/dns/hosts:/etc/coredns/hosts:ro
    depends_on:
      - wireguard
    restart: unless-stopped
