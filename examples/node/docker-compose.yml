services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: node-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      # Copy the profile generated by scripts/peer/add.sh here as wg0.conf.
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - proxy
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    container_name: node-traefik
    # Traefik listens on the WireGuard peer address, not on host ports.
    network_mode: service:wireguard
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - wireguard
    restart: unless-stopped

networks:
  proxy:
    name: node-proxy
