user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# Layer-4 TCP/UDP stream proxy – no HTTP block needed.
# Individual routing rules are in /etc/nginx/stream.d/*.conf
# (mounted from data/nginx/ on the host).
stream {
    log_format basic '$remote_addr [$time_local] $protocol $status '
                     '$bytes_sent $bytes_received $session_time';

    access_log /var/log/nginx/stream_access.log basic;

    include /etc/nginx/stream.d/*.conf;
}
